<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#833ab4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fd1d1d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcb045;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" rx="15" ry="15"/>
  <text x="50%" y="50%" font-family="Arial, sans-serif" font-weight="bold" font-size="36" fill="white" dominant-baseline="middle" text-anchor="middle">
    Awesome Developer Collaboration
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
  </text>
  <text x="50%" y="70%" font-family="Arial, sans-serif" font-size="24" fill="white" dominant-baseline="middle" text-anchor="middle">
    Tools &amp; Platforms
  </text>
</svg>
